name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Run the full cross-platform matrix.
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cost audit: no cron schedule here. Daily or higher-frequency automation is not
# justified for this workflow, so the expensive full matrix stays on manual
# offload only via workflow_dispatch.

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          args: --output.checkstyle.path=golangci-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golangci-report
          path: golangci-report.xml
          if-no-files-found: ignore
          retention-days: 7

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lock-verify:
    name: Verify lock sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#just -- verify

  nix-build-linux:
    name: nix build (x86_64-linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - run: nix build .#packages.x86_64-linux.default

  nix-build-cross:
    name: nix build (${{ matrix.system }})
    if: github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15-intel
            system: x86_64-darwin
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - run: nix build .#packages.${{ matrix.system }}.default

  devenv-test-linux:
    name: devenv test (ubuntu-latest)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run devenv tests
        run: devenv test

  devenv-test-macos:
    name: devenv test (macos-latest)
    if: github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: jylhis
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run devenv tests
        run: devenv test

  sonarqube:
    name: SonarQube
    needs: [go-lint, go-test]
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - uses: actions/download-artifact@v8
        with:
          name: golangci-report
        continue-on-error: true
      - name: Extract version
        id: go_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          args: -Dsonar.projectVersion=${{ steps.go_version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
