name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@0a12ed6d4f8b67b4e4c38f95d70f71f10fdd0c17
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@93d76093f91f38b8a1b9686583efdc4e5d59a86e
        with:
          args: --output.checkstyle.path=golangci-report.xml
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: golangci-report
          path: golangci-report.xml
          if-no-files-found: ignore
          retention-days: 7

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@0a12ed6d4f8b67b4e4c38f95d70f71f10fdd0c17
        with:
          go-version-file: go.mod
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lock-verify:
    name: Verify lock sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: cachix/install-nix-action@e2b3c2b8fbd6f2d645f90e2998878e9ef32ed500
      - run: nix run nixpkgs#just -- verify

  nix-build-linux:
    name: nix build (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: cachix/install-nix-action@e2b3c2b8fbd6f2d645f90e2998878e9ef32ed500
      - uses: cachix/cachix-action@4c1ed6db6d5f2f7af5120a0610b4bea8e1e8b8e0
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#packages.x86_64-linux.default

  nix-build-cross:
    name: nix build (${{ matrix.system }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15-intel
            system: x86_64-darwin
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: cachix/install-nix-action@e2b3c2b8fbd6f2d645f90e2998878e9ef32ed500
      - uses: cachix/cachix-action@4c1ed6db6d5f2f7af5120a0610b4bea8e1e8b8e0
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#packages.${{ matrix.system }}.default

  devenv-test-linux:
    name: devenv test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: cachix/install-nix-action@e2b3c2b8fbd6f2d645f90e2998878e9ef32ed500
      - uses: cachix/cachix-action@4c1ed6db6d5f2f7af5120a0610b4bea8e1e8b8e0
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run devenv tests
        run: devenv test

  devenv-test-macos:
    name: devenv test (macos-latest)
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: cachix/install-nix-action@e2b3c2b8fbd6f2d645f90e2998878e9ef32ed500
      - uses: cachix/cachix-action@4c1ed6db6d5f2f7af5120a0610b4bea8e1e8b8e0
        with:
          name: jylhis
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run devenv tests
        run: devenv test

  sonarqube:
    name: SonarQube
    needs: [go-lint, go-test]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: coverage
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: golangci-report
        continue-on-error: true
      - name: Extract version
        id: go_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e44258d8f4d0f1f8ce59c5d681f0a0a3f783b3dc
        with:
          args: -Dsonar.projectVersion=${{ steps.go_version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
