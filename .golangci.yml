version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unparam
    - unused

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 0
